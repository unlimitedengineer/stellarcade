exclude = [
    "higher-lower",
    "challenge-ladder",
    "merch-redemption",
    "profile-perks",
    # The crates below fail `cargo clippy --workspace -D warnings` (mostly
    # unused imports/dead code in unfinished stubs) or don't compile at all
    # under the wasm32v1-none target, surfaced when CI moved from a curated
    # per-crate list to whole-workspace checks. Excluded here (not just
    # documented) because `exclude` only takes effect for members not listed
    # explicitly in `members` above — they've been removed from `members`
    # too. Fix and re-add individually; don't bulk re-add.
    "achievements",
    "anti-cheat-bounties",
    "arena-ladder",
    "arena-passes",
    "asset-escrow-v3",
    "attendance-pass",
    "auction-house",
    "badge-minter",
    "bonus-rotator",
    "clan-registry",
    "comprehensive-test-suite",
    "contract-interaction-library",
    "contract-upgrade-timelock",
    "creator-drops",
    "creator-vaults",
    "cross-chain-bridge",
    "daily-challenges",
    "daily-reward-emission",
    "escrow-ledger",
    "escrow-vault",
    "fanout-distributor",
    "governance-token",
    "guild-progress",
    "ladder-checkpoints",
    "ladder-seasons",
    "loot-crate",
    "map-rotation",
    "map-voting",
    "mission-ledger",
    "player-rating",
    "prize-router-v2",
    "quest-board",
    "quest-ledger-v2",
    "queue-rewards",
    "raffle-engine",
    "rank-rewards",
    "referral-quests",
    "reserve-auction",
    "reward-bridges",
    "reward-unlocker",
    "reward-vesting",
    "round-vouchers",
    "season-pass",
    "season-rewards-vault",
    "session-nonce-manager",
    "speed-trivia",
    "squad-match",
    "squad-rewards",
    "squad-roster",
    "staking",
    "tournament-system",
    "trivia-game",
    "upgrade-mechanism",
    "wallet-claims-v2",
    "wallet-reserves",
    # These fail specifically at the `cargo test --workspace` / --tests step
    # (native host target), not the wasm build/clippy passes above: either a
    # dev-dependency rand_core version conflict pulled in via soroban-sdk's
    # testutils feature (fee-management), a missing `use
    # soroban_sdk::testutils::Ledger;` import in test code (jackpot-pool,
    # lending-pool), or an `Option<CustomStruct>` #[contracttype] that
    # doesn't satisfy soroban's XDR conversion bounds (quest-redeemer,
    # reserve-manager).
    "fee-management",
    "jackpot-pool",
    "lending-pool",
    "quest-redeemer",
    "reserve-manager",
    # Pin an older soroban-sdk 21.x line whose testutils feature drags in
    # soroban-env-host 21.2.1, which conflicts on rand_core version between
    # ed25519-dalek and rand_chacha — same root cause as fee-management
    # above, different trigger crates.
    "contract-address-registry",
    "reward-router",
    "tournament-lobby",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
lto = true
codegen-units = 1
